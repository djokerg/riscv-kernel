name: build-and-test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build toolchain image
        run: docker build -t os1-toolchain .

      - name: Build kernel and run all tests in QEMU
        run: docker run --rm -v "$PWD":/os1 os1-toolchain scripts/run-tests.sh

      - name: Upload QEMU logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: build/test-logs/
